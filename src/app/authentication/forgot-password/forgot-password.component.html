<main class="auth-shell">
  <div class="auth-layout">
    <section class="auth-panel">
      <header class="auth-brand-row">
        <a routerLink="/" class="brand-link">
          <span class="brand-mark">
            <img
              src="assets/images/cavero-logo.png"
              alt="Cavero Fragrances"
              class="brand-logo"
              width="160"
              height="44">
          </span>
        </a>

        <a routerLink="/signin" class="back-link">
          <i class="ci-chevron-left"></i>
          <span>Back to Sign In</span>
        </a>
      </header>

      <div class="recovery-card">
        <h1>Forgot password?</h1>
        <p>Enter the email address you used when you joined and we'll send you instructions to reset your password</p>

        <form [formGroup]="authForm" (ngSubmit)="onSubmit()" novalidate>
          <div class="alert-banner success" *ngIf="successMessage">{{ successMessage }}</div>
          <div class="alert-banner error" *ngIf="errorMessage">{{ errorMessage }}</div>

          <div class="field-group">
            <div class="field-shell" [class.invalid]="(f['email'].touched || submitted) && f['email'].invalid">
              <i class="ci-mail field-icon"></i>
              <input type="email" formControlName="email" placeholder="Email address">
            </div>
            <div class="field-error" *ngIf="(f['email'].touched || submitted) && f['email'].invalid">
              Please enter a valid email address
            </div>
          </div>

          <button type="submit" class="primary-btn" [disabled]="loading">
            <span *ngIf="loading" class="spinner-border spinner-border-sm me-2" role="status"></span>
            {{ loading ? 'Sending link...' : 'Reset password' }}
          </button>
        </form>

        <footer class="auth-footer">
          <a routerLink="/cms/faq" class="help-link">Need help?</a>
          <p>&copy; All rights reserved. Cavero Fragrances, Surat</p>
        </footer>
      </div>
    </section>

    <aside class="auth-visual">
      <div class="visual-card">
        <img
          src="https://res.cloudinary.com/douotprmz/image/upload/cavero/home/mens-fragrances.png"
          alt="Password recovery"
          width="1100"
          height="1098"
          decoding="async">
      </div>
    </aside>
  </div>
</main>
