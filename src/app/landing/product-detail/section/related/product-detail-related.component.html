<section class="container pb-5 mb-2 mb-sm-3 mb-lg-4 mb-xl-5" *ngIf="relatedProducts.length > 0">
  <div class="d-flex align-items-center justify-content-between border-bottom pb-3 pb-md-4 mb-3 mb-md-4">
    <h2 class="h3 mb-0">Related products</h2>
    <div class="d-flex gap-2 ms-3">
      <button type="button" class="btn btn-icon btn-outline-secondary animate-slide-start rounded-circle me-1"
        (click)="scrollLeft()" aria-label="Prev">
        <i class="ci-chevron-left fs-lg animate-target"></i>
      </button>
      <button type="button" class="btn btn-icon btn-outline-secondary animate-slide-end rounded-circle"
        (click)="scrollRight()" aria-label="Next">
        <i class="ci-chevron-right fs-lg animate-target"></i>
      </button>
    </div>
  </div>

  <div class="d-flex gap-3 overflow-auto pb-2 related-scroll" #scrollContainer>
    <div *ngFor="let product of relatedProducts" class="related-item">
      <div class="card product-card h-100 bg-transparent border-0 shadow-none">
        <div class="position-relative z-2">
          <span *ngIf="product.discount" class="badge text-bg-danger position-absolute top-0 start-0 z-2 mt-1 ms-1">
            {{product.discountAmount}}
          </span>
          <button type="button"
            class="btn btn-icon btn-sm wishlist-btn animate-pulse fs-sm position-absolute top-0 end-0 z-2 mt-1 mt-sm-2 me-1 me-sm-2"
            (click)="toggleFavorite(product)"
            aria-label="Add to Wishlist">
            <i [class]="product.isFavorite ? 'ci-heart-filled text-danger animate-target' : 'ci-heart animate-target'"></i>
          </button>
          <a class="d-block" [routerLink]="['/product', getProductRouteParam(product)]">
            <div class="ratio" style="--cz-aspect-ratio: calc(160 / 191 * 100%); border-radius: .75rem; overflow: hidden;">
              <img [src]="product.image" [alt]="product.name"
                (error)="product.image='assets/cavero/img/shop/grocery/01.png'">
            </div>
          </a>
          <div class="position-absolute w-100 start-0 bottom-0">
            <div class="d-flex justify-content-end px-2 px-lg-3 pb-2 pb-lg-3">
              <button
                *ngIf="(product.stock ?? 0) > 0"
                type="button"
                class="add-btn btn btn-icon btn-sm rounded-3"
                (click)="incrementQuantity(product, $event)"
                aria-label="Add to cart"
              >
                <i class="ci-plus fs-sm"></i>
              </button>
            </div>
          </div>
        </div>
        <div class="card-body pt-0 px-1 px-md-2 px-lg-3 pb-2">
          <h3 class="product-card-name fs-sm lh-base mb-1">
            <a class="hover-effect-underline fw-normal" [routerLink]="['/product', getProductRouteParam(product)]">{{product.name}}</a>
          </h3>
          <div class="product-card-price h6 mb-1">
            &#8377;{{product.price | number:'1.2-2'}}
            <del *ngIf="(product.originalPrice ?? 0) > product.price" class="product-card-original-price fs-sm fw-normal text-body-tertiary ms-1">&#8377;{{product.originalPrice | number:'1.2-2'}}</del>
          </div>
          <div *ngIf="product.short_description" class="fs-xs text-body-secondary mb-1">
            {{ product.short_description }}
          </div>
          <div *ngIf="product.weight" class="fs-xs text-body-secondary mb-1">
            {{ product.weight }}
          </div>
          <div *ngIf="(product.stock ?? 0) <= 0" class="fs-xs fw-bold text-danger mt-1">
            Out of stock
          </div>
          <div *ngIf="(product.stock ?? 0) > 0 && (product.stock ?? 0) < 5" class="fs-xs fw-semibold text-warning mt-1">
            Only {{ product.stock }} left
          </div>
        </div>
      </div>
    </div>
  </div>
</section>
