<nav #navbar class="navbar active">
  <div class="container-fluid">
    <div class="navbar-header">
      <a href="#" onClick="return false;" class="navbar-toggle collapsed"
        (click)="isNavbarCollapsed = !isNavbarCollapsed" aria-expanded="false"></a>
      <a href="#" onClick="return false;" class="bars" (click)="mobileMenuSidebarOpen($event,'overlay-open')"></a>
      <a class="navbar-brand" routerLink={{homePage}}>
        <span class="logo-name">{{token.hospital_name}}</span>
      </a>
    </div>
    <div class="collapse navbar-collapse" [ngClass]="isNavbarCollapsed ? '' : 'show'">
      <ul class="float-start collapse-menu-icon">
        <li>
          <button mat-icon-button (click)="callSidemenuCollapse()" class="sidemenu-collapse nav-notification-icons"> <i
              class="material-icons-outlined icon-color">
              menu
            </i></button>
        </li>
      </ul>
      <!-- <ul class="float-start collapse-menu-icon" >
        <li>
          <app-currency-selector></app-currency-selector>
        </li>
      </ul> -->

    

      <ul class="nav navbar-nav navbar-right hospital-group-list">
        <!-- Full Screen Button -->

        <li class="fullscreen">
          <button mat-icon-button class="nav-notification-icons" (click)="callFullscreen()">
            <i class="material-icons-outlined icon-color">
              {{ isFullScreen ? 'fullscreen_exit' : 'fullscreen' }}
            </i>
          </button>

        </li>
        <!-- #END# Full Screen Button -->
        <!-- #START# Notifications-->
        <li>
          <button mat-icon-button [matMenuTriggerFor]="notificationMenu" class="nav-notification-icons">
            <i class="material-icons-outlined icon-color">
              {{ notifications.length > 0 ? 'notifications_active' : 'notifications_none' }}
            </i>
            <span *ngIf="notifications.length" class="notification-view label-warning">
              {{ notifications.length }}
            </span>
          </button>

          <mat-menu #notificationMenu="matMenu" class="nfc-menu">
            <div class="nfc-header">
              <h5 class="mb-0">Notitications</h5>
              <a class="nfc-mark-as-read">Mark all as read</a>
            </div>
            <div class="nfc-dropdown">
              <ng-scrollbar style="height: 350px" visibility="hover">
                <div class="noti-list header-menu">
                  <div class="menu">
                    <div class="notification-wrapper">
                      @for (notification of notifications; track notification.id) {
                      <button mat-menu-item (click)="$event.stopPropagation()">
                        <span class="table-img msg-user">
                          <img [src]="hospitalImage" width="32" height="32" alt="User">
                        </span>

                        <span class="menu-info">
                          <span class="menu-title">{{ notification.notification_title }}</span>
                          <span class="menu-desc mt-2">
                            {{ notification.notification_tax }}
                          </span>
                        </span>

                        <span class="nfc-close" >
                          <app-feather-icons [icon]="'x'" class="user-menu-icons"></app-feather-icons>
                        </span>
                      </button>
                      }
                    </div>

                  </div>
                </div>
              </ng-scrollbar>
            </div>
            <div class="nfc-footer">
              <a class="nfc-read-all" >
                Read All Notifications
              </a>

            </div>
          </mat-menu>
        </li>
        <!-- #END# Notifications-->
        <li class="nav-item user_profile">
          <button mat-button [matMenuTriggerFor]="profilemenu">
            <div class="chip dropdown-toggle" ngbDropdownToggle class="">
              <!-- <span class="chip-label">{{ displayName | capitalize }}</span> -->
              <img
                [src]="userImg"
                class="user_img"
                [class.user_img_brand]="isBrandUserLogo"
                [style.width.px]="isBrandUserLogo ? 88 : 32"
                [style.height.px]="isBrandUserLogo ? 40 : 32"
                [attr.width]="isBrandUserLogo ? 88 : 32"
                [attr.height]="isBrandUserLogo ? 40 : 32"
                alt="Cavero Fragrances"
              >
            </div>
          </button>
          <mat-menu #profilemenu="matMenu" class="profile-menu">
            <div class="noti-list">
              <div class="menu ">
                <div class="user_dw_menu">
                  @if (this.token.role !== 'Superuser') {
                  <a mat-menu-item routerLink={{profilePage}} class="user-item-list">
                    <app-feather-icons [icon]="'user'" [class]="'user-menu-icons'"></app-feather-icons>Account
                  </a>
                  }
                  <!-- <button mat-menu-item class="user-item-list">
                    <app-feather-icons [icon]="'mail'" [class]="'user-menu-icons'"></app-feather-icons>Inbox
                  </button> -->
                  <!-- <button mat-menu-item class="user-item-list">
                    <app-feather-icons [icon]="'settings'" [class]="'user-menu-icons'"></app-feather-icons>Settings
                  </button> -->
                  <button mat-menu-item (click)="logout()" class="user-item-list">
                    <app-feather-icons [icon]="'log-out'" [class]="'user-menu-icons'"></app-feather-icons>Logout
                  </button>
                </div>
              </div>
            </div>
          </mat-menu>
        </li>
        <!-- #END# Tasks -->
      </ul>
    </div>
  </div>
</nav>
