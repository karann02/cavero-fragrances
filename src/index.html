  <style>
    /* ── Light mode ── */
    #deliveryOptions { background-color: #fff !important; }
    #deliveryOptions .offcanvas-header, #deliveryOptions .offcanvas-body { background-color: #fff !important; }
    #deliveryOptions .offcanvas-title { color: #1a1d23 !important; font-size: 1.25rem; font-weight: 700; }
    #deliveryOptions .btn-close { color: #1a1d23 !important; }
    #deliveryOptions .nav-pills .nav-link { color: #1a1d23 !important; border: 1px solid #dee2e6 !important; border-radius: 2rem !important; background: transparent !important; padding: 0.5rem 1.25rem; font-size: 0.9375rem; }
    #deliveryOptions .nav-pills .nav-link.active { border-color: #1a1d23 !important; font-weight: 600; }
    #deliveryOptions .btn-primary { background-color: #418576 !important; border-color: #418576 !important; color: #fff !important; border-radius: 2rem !important; }
    #deliveryOptions .text-body-secondary { color: #6c757d !important; }

    /* Address rows */
    #deliveryOptions .delivery-address-row {
      border-bottom: 1px solid #e9ecef;
      padding: 0.875rem 0;
      display: flex;
      align-items: center;
      gap: 0.75rem;
    }
    /* Radio button — circle with inner dot style */
    #deliveryOptions .delivery-radio {
      appearance: none;
      -webkit-appearance: none;
      width: 1.125rem;
      height: 1.125rem;
      border: 2px solid #adb5bd;
      border-radius: 50%;
      background: transparent;
      cursor: pointer;
      flex-shrink: 0;
      position: relative;
      margin: 0;
      transition: border-color 0.15s;
    }
    #deliveryOptions .delivery-radio:checked {
      border-color: #1a1d23;
      background: radial-gradient(circle, #1a1d23 40%, transparent 45%);
    }
    /* Address label */
    #deliveryOptions .delivery-addr-label {
      font-weight: 600;
      font-size: 0.9375rem;
      cursor: pointer;
      color: #1a1d23;
      flex: 1;
    }
    #deliveryOptions .delivery-remove-btn {
      background: none;
      border: none;
      padding: 0;
      opacity: 0.4;
      cursor: pointer;
      color: #1a1d23;
      font-size: 0.75rem;
      line-height: 1;
      flex-shrink: 0;
      transition: opacity 0.15s;
    }
    #deliveryOptions .delivery-remove-btn:hover { opacity: 0.9; }
    /* Add delivery address link with animate-underline */
    #deliveryOptions .delivery-add-link {
      font-weight: 600;
      font-size: 0.9375rem;
      color: #1a1d23;
      text-decoration: none;
      cursor: pointer;
      display: inline-block;
      margin-top: 0.75rem;
      background-image: linear-gradient(currentColor, currentColor);
      background-position: 0 100%;
      background-repeat: no-repeat;
      background-size: 0 1.5px;
      transition: background-size 0.3s ease;
      padding-bottom: 1px;
    }
    #deliveryOptions .delivery-add-link:hover { background-size: 100% 1.5px; }
  </style>
